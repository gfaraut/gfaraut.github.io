# Construit le site Quarto et le publie sur GitHub Pages (https://gfaraut.github.io).
# Déclenché à chaque envoi sur main, à la main (onglet Actions) et chaque lundi :
# la liste des publications est alors relue sur HAL et OpenAlex, sans aucune intervention.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # Lance aussi scripts/publications.py (pre-render) : publications à jour (HAL + OpenAlex).
      - name: Render
        run: quarto render

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
